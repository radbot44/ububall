<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Ubu Mint</title>
  <link rel="stylesheet" href="site.css">
  <script src="ubu.js" defer></script>
  <script src="ubu-file.js" defer></script>
  <script src="ubu-render.js" defer></script>
  <script src="rarity.js" defer></script>
  <script src="site.js" defer></script>
</head>
<body>
  <main>
    <header><a class="brand" href="/" aria-label="uburoom mint"><img src="uburoom-wordmark-brand.svg" alt="uburoom"><span>mint</span></a><nav aria-label="Main"><a class="quiet" href="/demo.html">Designer</a><a class="primary" id="login" href="/auth/discord" hidden>Sign in with Discord</a><button id="logout" hidden>Sign out</button></nav></header>
    <section class="pack-shop" aria-labelledby="pack-title">
      <h1 id="pack-title">Packs</h1>
      <button id="mint" class="candy-pack" disabled aria-label="Unwrap your ubu pack">
        <span class="candy-core" aria-hidden="true"><img src="uburoom-oomark-brand.svg" alt=""></span>
        <span class="wrapper-sheet" aria-hidden="true">
          <span class="wrapper-wing wrapper-left"></span>
          <span class="wrapper-shell"><img src="uburoom-wordmark-brand.svg" alt=""><span>mint</span></span>
          <span class="wrapper-wing wrapper-right"></span>
          <span class="wrapper-fold"></span>
        </span>
      </button>
      <p id="pack-hint">Sign in to unwrap your pack</p>
      <p id="status" role="status" aria-live="polite">Connecting to the mint…</p>
    </section>
    <section class="viewer" aria-label="Ubu viewer">
      <div id="preview"><p class="empty">No ubu selected</p></div>
      <h1 id="ubunym"></h1>
      <p id="details"></p>
      <p id="authenticity"></p>
      <div class="actions"><label class="button">Open .ubu<input id="import" type="file" accept=".ubu,application/json"></label><button id="download" hidden>Download .ubu</button></div>
    </section>
    <section id="collection" hidden aria-labelledby="collection-title"><h2 id="collection-title">Your ubus</h2><div id="ubus" class="grid"></div><button id="more" hidden>Load more</button></section>
  </main>
  <dialog id="reveal" aria-labelledby="reveal-title">
    <div class="reveal-toolbar"><h2 id="reveal-title">Pack</h2><button id="pause-reveal" class="icon-button" aria-label="Close pack">×</button></div>
    <div class="reveal-layout">
      <button id="prev-ubu" class="icon-button" aria-label="Previous ubu"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m14 6-6 6 6 6"/></svg></button>
      <div id="card-stage" class="card-stage"></div>
      <button id="next-ubu" class="icon-button" aria-label="Next ubu"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m10 6 6 6-6 6"/></svg></button>
    </div>
    <p id="reveal-progress" aria-live="polite"></p>
    <div id="reveal-dots" class="reveal-dots" aria-hidden="true"></div>
    <button id="finish-pack" class="primary" hidden>Done</button>
  </dialog>
</body>
</html>
