<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Ubu Mint</title>
  <link rel="stylesheet" href="site.css">
  <script src="ubu.js" defer></script>
  <script src="ubu-file.js" defer></script>
  <script src="ubu-render.js" defer></script>
  <script src="site.js" defer></script>
</head>
<body>
  <main>
    <header><a class="brand" href="/">ubu mint</a><nav aria-label="Main"><a href="/demo.html">Designer</a><a id="login" href="/auth/discord" hidden>Sign in with Discord</a><button id="logout" hidden>Sign out</button></nav></header>
    <section class="viewer" aria-label="Ubu viewer">
      <div id="preview"><p class="empty">Open a .ubu file to meet your ubu.</p></div>
      <h1 id="ubunym">Your ubu, here.</h1>
      <p id="details">View a certificate or get an ubu from the mint.</p>
      <p id="authenticity"></p>
      <div class="actions"><label class="button">Open .ubu<input id="import" type="file" accept=".ubu,application/json"></label><button id="download" hidden>Download .ubu</button><button id="mint" disabled>Get an ubu</button></div>
      <p id="status" role="status" aria-live="polite">Connecting to the mint…</p>
    </section>
    <section id="collection" hidden aria-labelledby="collection-title"><h2 id="collection-title">Your ubus</h2><div id="ubus" class="grid"></div><button id="more" hidden>Load more</button></section>
  </main>
</body>
</html>
