apply plugin: 'com.android.application'

def signingProps = new Properties()
def signingCandidates = [
    rootProject.file('keystore.properties'),
    System.getenv('LOCALAPPDATA') ? new File(System.getenv('LOCALAPPDATA'), 'ubumint/android-signing.properties') : null,
    System.getProperty('user.home') ? new File(System.getProperty('user.home'), '.config/ubumint/android-signing.properties') : null
].findAll { it != null && it.isFile() }
if (!signingCandidates.isEmpty()) {
    signingCandidates[0].withInputStream { signingProps.load(it) }
}

// Native compatibility record shared with scripts/prepare-assets.cjs (OTA minNativeVersion).
def nativeCompat = new groovy.json.JsonSlurper().parse(rootProject.file('../native-compat.json'))
def nativeVersionCode = nativeCompat.versionCode as int
if (!nativeCompat.nativeVersions.containsKey(String.valueOf(nativeVersionCode))) {
    throw new GradleException("mobile/native-compat.json has no nativeVersions entry for versionCode ${nativeVersionCode}")
}
// Public half of the OTA manifest signing key. Empty disables signed OTA updates (fail closed).
def otaPublicKeyFile = rootProject.file('../ota-public-key.pem')
def otaPublicKey = otaPublicKeyFile.isFile()
    ? otaPublicKeyFile.text.replaceAll(/-----(BEGIN|END) PUBLIC KEY-----/, '').replaceAll(/\s/, '')
    : ''
if (!(otaPublicKey ==~ /^[A-Za-z0-9+\/=]*$/)) throw new GradleException('mobile/ota-public-key.pem is not a PEM public key')

android {
    namespace = "one.tch.ububall"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "one.tch.ububall"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode nativeVersionCode
        versionName "1.0"
        buildConfigField 'String', 'OTA_PUBLIC_KEY', "\"${otaPublicKey}\""
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildFeatures {
        buildConfig = true
    }
    androidResources {
        noCompress "bin", "woff2"
    }
    signingConfigs {
        if (signingProps.getProperty('storeFile')) {
            release {
                storeFile file(signingProps.getProperty('storeFile'))
                storePassword signingProps.getProperty('storePassword')
                keyAlias signingProps.getProperty('keyAlias')
                keyPassword signingProps.getProperty('keyPassword')
            }
        }
    }
    buildTypes {
        release {
            if (signingConfigs.findByName('release') != null) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    testImplementation 'org.json:json:20240303'
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
