name: CI
on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.14'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run test:worker

  sql-reads-benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.14'
          cache: npm
      - run: npm ci
      - run: npm run bench:sql
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: durable-object-sql-reads
          path: |
            sql-rows-read-benchmark.json
            sql-rows-read-benchmark.csv
          if-no-files-found: ignore
