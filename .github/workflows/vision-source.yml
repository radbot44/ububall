name: Export public source for local visual testing
on:
  push:
    branches:
      - agent/vision-only-controller-20261110
    paths:
      - .github/workflows/vision-source.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: tar --exclude=.git --exclude=node_modules --exclude=dist -czf source-ububall.tgz .
      - uses: actions/upload-artifact@v4
        with:
          name: public-source-ububall
          path: source-ububall.tgz
          retention-days: 1
