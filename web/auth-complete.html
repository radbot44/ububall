<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="icon" href="/favicon.ico" sizes="32x32">
  <title>Signing in…</title>
  <style>
    :root { color-scheme: dark; }
    body {
      background: #101217;
      color: #F8F7F4;
      font: 14px/1.4 Inter, system-ui, -apple-system, sans-serif;
      display: grid;
      place-items: center;
      min-height: 100dvh;
      margin: 0;
    }
    .status {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      text-align: center;
      padding: 24px;
    }
    .return-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 10px 18px;
      border-radius: 10px;
      background: #0066FF;
      color: #FFFFFF;
      font-weight: 600;
      text-decoration: none;
    }
    .return-btn[hidden] { display: none; }
  </style>
</head>
<body>
  <div class="status">
    <p id="status-text">Signing in to Ububall…</p>
    <a id="mobile-return" class="return-btn" href="ububall://auth" hidden>Return to Ububall App</a>
  </div>
  <script>
    'use strict';
    (() => {
      const params = new URLSearchParams(location.search);
      if (params.get('mobile') === '1') {
        const hashParams = new URLSearchParams(location.hash.replace(/^#/, ''));
        const ticket = hashParams.get('ticket') || '';
        const deepLink = 'ububall://auth' + (ticket ? '#ticket=' + encodeURIComponent(ticket) : '');
        const btn = document.getElementById('mobile-return');
        const txt = document.getElementById('status-text');
        if (history.replaceState) {
          history.replaceState(null, '', location.pathname + location.search);
        }
        if (btn) {
          btn.href = deepLink;
          btn.hidden = false;
        }
        if (txt) {
          txt.textContent = 'Signed in! Returning to Ububall…';
        }
        location.replace(deepLink);
        return;
      }

      const isPopup = window.name === 'ubu_discord_auth' || Boolean(window.opener);
      try {
        if (typeof BroadcastChannel !== 'undefined') {
          const channel = new BroadcastChannel('ubu:auth');
          channel.postMessage({ type: 'ubu-auth-complete' });
          channel.close();
        }
      } catch {}
      try {
        localStorage.setItem('ubu:auth-complete', String(Date.now()));
        localStorage.removeItem('ubu:auth-complete');
      } catch {}
      try {
        if (window.opener && !window.opener.closed) {
          window.opener.postMessage({ type: 'ubu-auth-complete' }, window.location.origin);
        }
      } catch {}
      if (isPopup) {
        try { window.close(); } catch {}
        setTimeout(() => {
          if (!window.closed) window.location.replace('/');
        }, 150);
        return;
      }
      window.location.replace('/');
    })();
  </script>
</body>
</html>
