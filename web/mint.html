<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Mint &amp; Collection · Ububall</title>
  <link rel="stylesheet" href="site.css">
  <script src="ubu.js" defer></script>
  <script src="ubu-file.js" defer></script>
  <script src="ubu-render.js" defer></script>
  <script src="rarity.js" defer></script>
  <script src="ububall-physics.js" defer></script>
  <script src="ubu-audio.js" defer></script>
  <script src="pack-scene.js" defer></script>
  <script src="site-header.js" defer></script>
  <script src="site.js" defer></script>
</head>
<body>
  <header class="site-header">
    <a class="site-brand" href="/" aria-label="ububall"><img src="assets/ububall-logo.svg" alt="ububall"></a>
    <nav class="site-nav" aria-label="Main">
      <a href="/">Play</a>
      <a class="active" href="/mint.html" aria-current="page">Mint &amp; Collection</a>
      <a href="/demo.html">Designer</a>
      <a href="/voice.html">Voice Demo</a>
    </nav>
    <div class="site-header-actions">
      <button id="login" class="button primary" type="button" hidden>Sign in with Discord</button>
      <button id="identity" class="button quiet" type="button" aria-haspopup="dialog" aria-controls="account-dialog" aria-label="Account settings" title="Account settings" hidden>
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
          <circle cx="12" cy="7" r="4"/>
        </svg>
        <span class="identity-name">Account</span>
      </button>
    </div>
  </header>
  <main>
    
    <section class="pack-shop" aria-labelledby="pack-title">
      <h1 id="pack-title">Packs</h1>
      <div id="pack-choices" class="pack-choices" hidden></div>
      <p id="pack-hint" class="pack-prompt"></p>
      <button id="mint" class="primary" hidden>Continue pack</button>
      <p id="status" role="status" aria-live="polite">Connecting to the mint…</p>
    </section>
    <section id="collection" hidden aria-labelledby="collection-title">
      <div class="collection-header">
        <h2 id="collection-title">Your ubus</h2>
        <div class="collection-actions">
          <label class="button quiet file-btn">Open .ubu<input id="import" type="file" accept=".ubu,application/json"></label>
          <a id="play-with-ubus" class="button primary" href="/?roster=1">Play with my ubus</a>
          <label for="sort-ubus" class="sort-control">
            <span>Sort</span>
            <select id="sort-ubus">
              <option value="recent">Recent</option>
              <option value="old">Old</option>
              <option value="rarity">Rarity</option>
              <option value="serial">Serial number</option>
              <option value="favorite">Favorite</option>
            </select>
          </label>
        </div>
      </div>
      <div id="ubus" class="grid"></div>
      <div id="collection-sentinel" class="collection-sentinel" aria-hidden="true"></div>
      <button id="more" hidden>Load more</button>
      <p id="collection-status" class="collection-status" role="status" aria-live="polite" hidden></p>
    </section>
  </main>
  <dialog id="viewer" class="viewer" aria-labelledby="ubunym">
    <div class="viewer-toolbar">
      <div class="viewer-tabs" role="tablist" aria-label="Ubu view">
        <button id="view-ubu" type="button" role="tab" aria-selected="true" aria-controls="preview" data-view="ubu">Ubu</button>
        <button id="view-card" type="button" role="tab" aria-selected="false" aria-controls="viewer-card-stage" data-view="card" tabindex="-1">Card</button>
        <button id="view-token" type="button" role="tab" aria-selected="false" aria-controls="viewer-token-stage" data-view="token" tabindex="-1">Token</button>
      </div>
      <div class="viewer-actions">
        <button id="viewer-fav" class="icon-button card-heart" type="button" aria-label="Favorite" title="Favorite">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19.5 12.572l-7.5 7.428l-7.5 -7.428a5 5 0 1 1 7.5 -6.566a5 5 0 1 1 7.5 6.572"/></svg>
        </button>
        <button id="close-viewer" class="icon-button" type="button" aria-label="Close viewer">×</button>
      </div>
    </div>
    <div class="viewer-body">
      <div id="viewer-display" class="viewer-display">
        <div id="preview" class="viewer-preview" role="tabpanel" aria-labelledby="view-ubu"></div>
        <div id="viewer-card-stage" class="viewer-card-stage" role="tabpanel" aria-labelledby="view-card" hidden></div>
        <div id="viewer-token-stage" class="viewer-token-stage" role="tabpanel" aria-labelledby="view-token" hidden></div>
      </div>
      <h2 id="ubunym"></h2>
      <p id="details"></p>
      <p id="authenticity"></p>
      <div id="viewer-voice" class="viewer-voice">
        <div class="viewer-voice-bar">
          <button id="viewer-voice-tone" class="voice-play-btn" type="button" title="Play signature voice tone">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></svg>
            <span>Voice</span>
          </button>
          <button id="viewer-voice-fanfare" class="voice-play-btn" type="button" title="Play goal fanfare">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
            <span>Fanfare</span>
          </button>
        </div>
        <div id="viewer-voice-info" class="viewer-voice-info"></div>
      </div>
      <a id="download" class="secondary" download="ubu.ubu">Download .ubu</a>
    </div>
  </dialog>
  <dialog id="reveal" aria-labelledby="reveal-title">
    <div class="reveal-toolbar"><h2 id="reveal-title">Pack</h2><button id="pause-reveal" class="icon-button" aria-label="Close pack">×</button></div>
    <div class="reveal-layout">
      <button id="prev-ubu" class="icon-button" aria-label="Previous ubu"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m14 6-6 6 6 6"/></svg></button>
      <div id="card-stage" class="card-stage"></div>
      <button id="next-ubu" class="icon-button" aria-label="Next ubu"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m10 6 6 6-6 6"/></svg></button>
    </div>
    <p id="reveal-progress" aria-live="polite"></p>
    <div id="reveal-dots" class="reveal-dots" aria-hidden="true"></div>
    <button id="finish-pack" class="primary" hidden>Done</button>
  </dialog>
  <dialog id="account-dialog" class="account-dialog" aria-labelledby="account-dialog-title">
    <div class="account-dialog-header">
      <h2 id="account-dialog-title">Account</h2>
      <button id="account-close" class="icon-button" type="button" aria-label="Close account dialog">✕</button>
    </div>
    <div class="account-identities">
      <div class="account-provider-row">
        <div class="provider-details">
          <span class="discord-symbol">
            <svg viewBox="0 0 24 18" aria-hidden="true"><path d="M20.317 1.492a19.78 19.78 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 1.492a.07.07 0 0 0-.032.027C.533 6.185-.32 10.755.099 15.281a.082.082 0 0 0 .031.057 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028c.462-.63.874-1.295 1.226-1.994.021-.041.001-.09-.041-.106a13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128 10.2 10.2 0 0 0 .372-.292.074.074 0 0 1 .077-.01c3.929 1.793 8.18 1.793 12.061 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127 12.299 12.299 0 0 1-1.873.893.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.839 19.839 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.028zM8.02 12.33c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.956-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.956 2.418-2.157 2.418zm7.975 0c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.946 2.418-2.157 2.418z"/></svg>
          </span>
          <div class="provider-info">
            <h3>Discord</h3>
            <p id="discord-identity">Connected</p>
          </div>
        </div>
      </div>
    </div>
    <div class="account-dialog-actions">
      <button id="logout" class="button quiet" type="button">Sign out</button>
    </div>
  </dialog>
</body>
</html>
